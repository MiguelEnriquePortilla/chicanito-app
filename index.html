<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chicanito App — Very Facilito, Rapidito y Sabrosito!</title>
<meta name="description" content="Arma tu pedido directo en la app, sin costo extra.">
<link rel="icon" href="assets/brand/logo-badge.jpg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#17213E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chicanito">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-inner">
    <img src="assets/brand/logo-badge.jpg" alt="" class="splash-logo" id="splash-logo">
    <div class="splash-title">Chicanito <span>App</span></div>
    <div class="splash-tagline">Very Facilito, Rapidito y Sabrosito!</div>
  </div>
  <div class="splash-bottom">
    <div class="splash-bar"><div class="splash-bar-fill" id="splash-bar-fill"></div></div>
    <div class="splash-percent" id="splash-percent">0%</div>
  </div>
</div>
<script>
(function () {
  var splash = document.getElementById('splash');
  var fill = document.getElementById('splash-bar-fill');
  var percentEl = document.getElementById('splash-percent');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (sessionStorage.getItem('chicanito-splash-seen')) {
    splash.remove();
    return;
  }
  sessionStorage.setItem('chicanito-splash-seen', '1');

  if (reduceMotion) {
    splash.classList.add('is-done');
    setTimeout(function () { splash.remove(); }, 300);
    return;
  }

  var start = Date.now();
  var duration = 2000;
  function tick() {
    var elapsed = Date.now() - start;
    var pct = Math.min(100, Math.round((elapsed / duration) * 100));
    fill.style.width = pct + '%';
    percentEl.textContent = pct + '%';
    if (pct < 100) {
      requestAnimationFrame(tick);
    } else {
      splash.classList.add('is-done');
      setTimeout(function () { splash.remove(); }, 650);
    }
  }
  requestAnimationFrame(tick);
})();
</script>

<div class="top-bar" id="top-bar">
  <header class="site-header">
    <div class="container header-inner">
      <div style="display:flex; align-items:center; gap:0.6rem;">
        <img src="assets/brand/logo-badge.jpg" alt="Chicken Chicanito" class="header-logo">
        <span class="header-title">Chicanito <span>App</span></span>
      </div>
      <button class="cart-btn" id="open-cart-btn" type="button">
        🛒 <span class="cart-count" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div id="hours-banner" class="hours-banner" style="display:none;">
    Estamos cerrados por ahora. Recibimos pedidos en línea de 9:00 a 18:00 hrs.
  </div>

  <nav class="tabs" id="tabs"></nav>
</div>

<main>
  <div class="feed-container" id="feed-container"></div>

  <section class="alacarta-wrap container" id="alacarta-wrap">
    <p class="page-sub" style="padding-top:1rem;">Agrega complementos y salsas extra a tu pedido:</p>
    <div id="alacarta-container"></div>
  </section>
</main>

<!-- Burst de corazón al hacer doble-tap -->
<div class="heart-burst" id="heart-burst">❤️</div>

<!-- Toast simple para mensajes cortos -->
<div class="toast" id="toast"></div>

<!-- Overlay + Cart Drawer -->
<div class="overlay-dim hidden" id="cart-overlay"></div>
<aside class="cart-drawer hidden" id="cart-drawer">
  <div class="cart-drawer-header">
    <span class="cart-drawer-title">Tu carrito</span>
    <button class="modal-close" id="close-cart-btn" type="button" style="position:static;">✕</button>
  </div>
  <div class="cart-drawer-items" id="cart-items"></div>
  <div class="cart-drawer-footer">
    <div class="summary-line"><span>Subtotal</span><span id="cart-subtotal">$0</span></div>
    <div class="summary-line"><span>Envío</span><span id="cart-envio">$0</span></div>
    <div class="summary-line total"><span>Total</span><span id="cart-total">$0</span></div>
    <button class="btn btn-primary" id="checkout-btn" type="button">Continuar con mi pedido</button>
  </div>
</aside>

<!-- Modal: selector de variantes -->
<div class="modal-overlay hidden" id="variant-modal">
  <div class="modal-sheet">
    <button class="modal-close" id="close-modal-btn" type="button">✕</button>
    <h2 class="modal-title" id="modal-item-name"></h2>
    <p class="modal-price" id="modal-item-price"></p>
    <div id="modal-variants"></div>
    <button class="btn btn-primary" id="modal-add-btn" type="button" disabled>Agregar al carrito</button>
  </div>
</div>

<script src="js/transitions.js"></script>
<script src="js/menu.js"></script>
<script src="js/cart.js"></script>
<script src="js/hours.js"></script>
<script src="js/shipping.js"></script>
<script src="js/home.js"></script>
</body>
</html>
